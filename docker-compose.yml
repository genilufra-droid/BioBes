services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biobes}
      MYSQL_USER: ${MYSQL_USER:-biobes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your local environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
    volumes:
      - biobes_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-biobes}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-biobes}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your local environment}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      OWNER_NAME: ${OWNER_NAME:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
      LOCAL_AUTH_USERS_JSON: ${LOCAL_AUTH_USERS_JSON:-[]}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_DIR: /var/lib/biobes/storage
    volumes:
      - biobes_storage:/var/lib/biobes/storage
    ports:
      - "${BIOBES_PORT:-3000}:3000"

volumes:
  biobes_mysql:
  biobes_storage:
